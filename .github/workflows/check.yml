name: Check Serigraphica
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Test the shared Python engine and desktop sidecar
        run: |
          python3 -m venv .venv-ci
          .venv-ci/bin/pip install -r python/requirements.txt
          .venv-ci/bin/python -B -m unittest discover -s tests -p 'test_*.py'
